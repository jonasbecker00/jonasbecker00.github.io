<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Jonas Becker — Under Construction</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Lora:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f7f4ef;
      --ink: #1e1e1e;
      --ink-mid: #555;
      --accent: #c8602a;

      --font-hand: 'Chewy', cursive;
      --font-body: 'Lora', Georgia, serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      background: var(--bg);
      color: var(--ink);

      font-family: var(--font-body);
      text-align: center;
      padding: 2rem;
    }

    .card {
      max-width: 650px;
    }

    h1 {
      font-family: var(--font-hand);
      font-size: clamp(3rem, 8vw, 5rem);
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.8;
      color: var(--ink-mid);
      margin-bottom: 1.5rem;
    }

    .note {
      color: var(--accent);
      font-family: var(--font-hand);
      font-size: 1.4rem;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Under Construction ✨</h1>

    <p>
      I’m currently building this website.
      Some pages and features are still in progress.
    </p>

    <p class="note">
      Please check back soon.
    </p>
  </main>
</body>
</html>
